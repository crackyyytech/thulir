<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <radialGradient id="sunGradient" cx="0.7" cy="0.3">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFA500" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#4682B4"/>
    </linearGradient>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A90E2"/>
      <stop offset="100%" stop-color="#2E5C8A"/>
    </linearGradient>
    <!-- Clip path for inner circle -->
    <clipPath id="innerClip">
      <circle cx="100" cy="100" r="85"/>
    </clipPath>
    <!-- Paths for curved text -->
    <path id="topArc" d="M 25,25 A 75,75 0 0,1 175,25" fill="none"/>
    <path id="bottomArc" d="M 175,175 A 75,75 0 0,1 25,175" fill="none"/>
  </defs>
  
  <!-- Outer Circle with Light Blue Background -->
  <circle cx="100" cy="100" r="100" fill="#B0E0E6" stroke="#0A2540" stroke-width="2"/>
  
  <!-- Inner Circle (Landscape Scene) -->
  <g clip-path="url(#innerClip)">
    <circle cx="100" cy="100" r="85" fill="url(#skyGradient)"/>
    
    <!-- Sunburst/Lens Flare Effect -->
    <circle cx="140" cy="60" r="25" fill="url(#sunGradient)"/>
    <circle cx="140" cy="60" r="20" fill="#FFD700" opacity="0.6"/>
    
    <!-- Clouds -->
    <ellipse cx="80" cy="50" rx="15" ry="10" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="95" cy="50" rx="18" ry="12" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="110" cy="50" rx="15" ry="10" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="50" cy="70" rx="12" ry="8" fill="#FFFFFF" opacity="0.8"/>
    <ellipse cx="60" cy="70" rx="15" ry="10" fill="#FFFFFF" opacity="0.8"/>
    
    <!-- Mountains -->
    <polygon points="30,120 60,80 90,100 110,70 140,90 170,120" fill="#4A5568" opacity="0.8"/>
    <polygon points="40,120 70,85 100,105 120,75 150,95 170,120" fill="#2D3748" opacity="0.9"/>
    
    <!-- Forest/Trees -->
    <rect x="25" y="120" width="8" height="25" fill="#2D5016"/>
    <polygon points="29,120 25,105 33,105" fill="#228B22"/>
    <rect x="40" y="120" width="8" height="25" fill="#2D5016"/>
    <polygon points="44,120 40,105 48,105" fill="#228B22"/>
    <rect x="55" y="120" width="8" height="25" fill="#2D5016"/>
    <polygon points="59,120 55,105 63,105" fill="#228B22"/>
    <rect x="145" y="120" width="8" height="25" fill="#2D5016"/>
    <polygon points="149,120 145,105 153,105" fill="#228B22"/>
    <rect x="160" y="120" width="8" height="25" fill="#2D5016"/>
    <polygon points="164,120 160,105 168,105" fill="#228B22"/>
    <rect x="175" y="120" width="8" height="25" fill="#2D5016"/>
    <polygon points="179,120 175,105 183,105" fill="#228B22"/>
    
    <!-- Water Body -->
    <ellipse cx="100" cy="160" rx="70" ry="15" fill="url(#waterGradient)"/>
    <ellipse cx="100" cy="160" rx="70" ry="12" fill="#4A90E2" opacity="0.7"/>
    
    <!-- Stylized Human Figure (Yellow/Gold) -->
    <circle cx="100" cy="75" r="4" fill="#FFD700"/>
    <!-- Body -->
    <line x1="100" y1="75" x2="100" y2="90" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Arms -->
    <line x1="100" y1="80" x2="85" y2="70" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="100" y1="80" x2="115" y2="70" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="100" y1="90" x2="90" y2="105" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="100" y1="90" x2="110" y2="105" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Text: SATHYA UNAR (Top Arc) -->
  <text font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0A2540">
    <textPath xlink:href="#topArc" startOffset="50%" text-anchor="middle">SATHYA UNAR</textPath>
  </text>
  
  <!-- Text: CHARITABLE TRUST (Bottom Arc) -->
  <text font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#0A2540">
    <textPath xlink:href="#bottomArc" startOffset="50%" text-anchor="middle">CHARITABLE TRUST</textPath>
  </text>
</svg>
